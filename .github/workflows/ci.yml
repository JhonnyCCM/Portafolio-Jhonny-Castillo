name: CI & Build Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vite production build
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || exit 1
          test -f dist/admin.html || exit 1
          echo "Production build passed and critical assets verified."
